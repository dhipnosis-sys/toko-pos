<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#065f46" />
    <title>Offline — Warung Nuhahade</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        padding: 32px 24px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #065f46;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 30px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #475569; font-size: 14px; line-height: 1.6; }
      button {
        background: #059669;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button:hover { background: #047857; }
      .hint { margin-top: 14px; font-size: 12px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📶</div>
      <h1>Sedang offline</h1>
      <p>
        Tidak ada koneksi internet. Beberapa halaman mungkin masih tersimpan di
        perangkat ini. Data terbaru membutuhkan koneksi.
      </p>
      <button onclick="location.reload()">Coba lagi</button>
      <div class="hint">Warung Nuhahade — POS &amp; Inventori</div>
    </div>
  </body>
</html>
